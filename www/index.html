<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کابینت‌ساز ArchTverse</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="jspdf.umd.min.js"></script>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d1d1f"><link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;--bg:#f4f2ee;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--acc:#8a5a2b;--line:#e3dfd8;--warn:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{position:sticky;top:0;z-index:5;background:#1d1d1f;color:#fff;padding:10px 14px 0}
header h1{margin:0 0 6px;font-size:16px;font-weight:800}
header h1 small{color:#c9a27a;font-weight:600;margin-inline-start:6px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:#bbb;font:inherit;padding:8px 10px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:#fff;border-color:#c9a27a}
main{padding:10px;max-width:1300px;margin:auto}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row label{flex:1;min-width:90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select,option{font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fcfbf9;color:var(--ink);width:100%}
.btn{font:inherit;color:var(--ink);border:1px solid var(--line);background:#faf8f5;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.btn.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.btn.d{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.wrap{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 340px}}
#ed{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#ed,#ved{position:relative}.tb{position:absolute;top:6px;left:6px;right:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 2px 10px rgba(0,0,0,.12);z-index:2}.tb .btn{padding:6px 9px;font-size:13px}.tb b{font-size:13px;margin:0 4px}.tb input{width:80px;padding:5px}.tb:empty{display:none}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid #ddd;cursor:pointer;padding:0}.sw.on{outline:3px solid var(--acc);outline-offset:2px}.sws{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}.pv button{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:4px;font:inherit;font-size:11px;cursor:pointer;color:var(--ink)}.pv button.on{border-color:var(--acc);background:#fbf5ee}.pv svg{width:100%;height:70px;display:block;direction:ltr}.pv small{display:block;color:var(--mut);font-size:9px;direction:ltr}
#ed svg,#vsvg{direction:ltr;}#ed svg{display:block;width:100%;height:62vh;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{color:var(--mut);font-size:12.5px;line-height:1.9;margin:4px 0}
.warn{background:#fff4f2;border:1px solid #f1c6c0;color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.warn ul{margin:4px 0;padding-inline-start:18px}.ok{background:#f0f7f0;border-color:#c5e0c5;color:#256b2a}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:auto}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600}
.sheet .bar button{font:inherit;border:1px solid var(--line);background:#faf8f5;border-radius:8px;padding:3px 10px;cursor:pointer}
.sv{direction:ltr;padding:6px}.sv svg{display:block;width:100%;height:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;direction:ltr}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
th{background:#f7f4ef}.tw{overflow:auto;max-height:60vh}
.op{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.stats div{background:#faf8f5;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.stats b{display:block;font-size:15px}
#toast{max-width:92vw;text-align:center;line-height:1.7;}
.fab{position:absolute;bottom:8px;right:8px;z-index:3;background:#b3261e!important;color:#fff!important;border-color:#b3261e!important;font-size:16px;padding:10px 14px!important;border-radius:24px!important;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1 style="display:flex;align-items:center;gap:6px">کابینت‌ساز <small>ArchTverse</small><span style="margin-inline-start:auto;display:flex;gap:4px"><button class="btn" data-ur="-1" title="Ctrl+Z">↶ برگشت</button><button class="btn" data-ur="1" title="Ctrl+Y">↷</button></span></h1>
<nav id="nav"><button data-t="space" class="on">۱. فضا</button><button data-t="cab">۲. کابینت</button><button data-t="elv">۳. نماها</button><button data-t="dwg">۴. خروجی</button><button data-t="cost">۵. برآورد</button><button data-t="adv">جزئیات</button></nav></header>
<main>
<div id="edwrap" class="wrap"><div id="ed"><div class="tb" id="etb"></div><button class="btn fab" id="efab" style="display:none">🗑 حذف</button><div class="zm" style="position:absolute;bottom:8px;left:8px;display:flex;gap:4px;z-index:2"><button class="btn" data-z="1">＋</button><button class="btn" data-z="-1">－</button><button class="btn" data-z="0">⤢</button></div><svg id="esvg" xmlns="http://www.w3.org/2000/svg"><g id="eg"></g></svg></div><div id="side"></div></div>
<section class="tab" id="t-elv"><div class="chips" id="vchips" style="margin:4px 0 8px"></div><div class="wrap"><div id="ved"><div class="tb" id="vtb"></div><button class="btn fab" id="vfab" style="display:none">🗑 حذف</button><div style="position:absolute;bottom:8px;left:8px;display:flex;gap:4px;z-index:2"><button class="btn" data-vz="1">＋</button><button class="btn" data-vz="-1">－</button><button class="btn" data-vz="0">⤢</button></div><div style="background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden"><svg id="vsvg" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:58vh;touch-action:none;user-select:none"><g id="vg"></g></svg></div></div><div id="vside"></div></div></section>
<section class="tab" id="t-dwg"></section>
<section class="tab" id="t-cost"></section>
<section class="tab" id="t-adv"></section>
</main>
<div id="toast"></div>
<script>
/* ================= CORE ================= */
const DEF={proj:'KITCHEN-01',H:2800,wallT:200,style:'modern',
poly:[[0,0],[4000,0],[4000,-3200],[0,-3200]],
edges:[{w:1,cab:1,win:[{x:1500,w:1000,sill:1100,h:1200}],door:[]},{w:1,cab:0,win:[],door:[]},{w:1,cab:0,win:[],door:[{x:300,w:900,h:2100}]},{w:1,cab:1,win:[],door:[]}],
preset:'L',door:'flat',handle:'gola',colB:'white',colW:'white',fin:'matte',top:'quartz',hfin:'black',sheetL:3660,sheetW:1830,waste:15,prices:{},cur:'',site:'',profit:0,man:{},sink:{e:0,x:1900},hob:{e:3,x:2000},fr:{e:3,x:375},isl:{on:0,x:1000,y:-1700,L:2000,D:1000},
counterH:900,plinth:100,topT:40,baseD:600,wallD:350,splash:550,wallMode:'ceil',wallH:800,t:16,
sinkW:800,dw:'R',waterH:550,drainH:450,hobW:600,hobType:'gas',gasH:550,frW:750,frH:1850,oven:0,ovenZ:850,sockH:1100,sockLowH:300};
const TL={corner:'کنج کور',sink:'سینک',hob:'زیر گاز (کشو)',dw:'ماشین ظرفشویی',d1:'یک‌درب',d2:'دودرب',drw:'کشویی',pull:'سوپری باریک',filler:'فیلر',endp:'بغل‌بند جزیره',fridge:'محفظه یخچال',oven:'ستون فر',w1:'بالا یک‌درب',w2:'بالا دودرب',hood:'کابینت هود',open:'قفسه باز',void:'در/پنجره',glass:'دکور شیشه‌ای',drainer:'آبچکان',ovenb:'فر زیر گاز'};
const EN={corner:'BLIND CORNER',sink:'SINK BASE',hob:'HOB DRAWERS',dw:'DISHWASHER',d1:'BASE 1D',d2:'BASE 2D',drw:'DRAWER',pull:'PULL-OUT',filler:'FILLER',endp:'END PANEL',fridge:'FRIDGE HOUSING',oven:'OVEN TALL',w1:'WALL 1D',w2:'WALL 2D',hood:'HOOD UNIT',open:'OPEN SHELF',glass:'GLASS DISPLAY',drainer:'DISH RACK UNIT',ovenb:'BUILT-IN OVEN'};
const LET=i=>i==='ISL'?'ISL':String.fromCharCode(65+i);
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],add2=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(a,k)=>[a[0]*k,a[1]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1],crs=(a,b)=>a[0]*b[1]-a[1]*b[0],unit=a=>{const l=Math.hypot(a[0],a[1])||1;return[a[0]/l,a[1]/l];};
function eg(S,i){if(i==='ISL'){const I=S.isl;return{o:[I.x+I.L,I.y],d:[-1,0],n:[0,-1],len:I.L};}
 const p=S.poly,a=p[i],b=p[(i+1)%p.length],v=sub(b,a),d=unit(v);return{o:a,d,n:[d[1],-d[0]],len:Math.round(Math.hypot(v[0],v[1]))};}
function P(S,i,s,n){const g=eg(S,i);return[g.o[0]+g.d[0]*s+g.n[0]*n,g.o[1]+g.d[1]*s+g.n[1]*n];}
function quad(S,i,s0,s1,n0,n1){return[P(S,i,s0,n0),P(S,i,s1,n0),P(S,i,s1,n1),P(S,i,s0,n1)];}
function lineInt(p,d,q,e){const den=crs(d,e);if(Math.abs(den)<1e-9)return null;const t=crs(sub(q,p),e)/den;return add2(p,mul(d,t));}
function overlap(A,B){for(const Q of[A,B])for(let i=0;i<Q.length;i++){const a=Q[i],b=Q[(i+1)%Q.length],ax=[b[1]-a[1],a[0]-b[0]];let m1=1e18,M1=-1e18,m2=1e18,M2=-1e18;
 for(const p of A){const v=dot(p,ax);m1=Math.min(m1,v);M1=Math.max(M1,v);}for(const p of B){const v=dot(p,ax);m2=Math.min(m2,v);M2=Math.max(M2,v);}const l=Math.hypot(ax[0],ax[1]);if(M1<=m2+l||M2<=m1+l)return false;}return true;}
function area(p){let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1];}return a/2;}
function fixOrient(S){if(area(S.poly)>0){S.poly.reverse();const n=S.edges.length,ne=[];for(let i=0;i<n;i++){const e=S.edges[(n-2-i+n)%n];ne.push(e);}S.edges=ne;}}

function fill(G,layer,minF){
 if(G<=0)return{u:[],f:0};
 const sz=layer==='b'?[[150,1.7],[200,1.6],[250,1.6],[300,1.25],[350,1.3],[400,1],[450,1],[500,1.1],[600,1],[800,1.05],[900,1.05]]:[[300,1.2],[350,1.3],[400,1],[450,1],[500,1.1],[600,1],[800,1.05],[900,1.05]];
 let best=null;
 for(let f=minF;f<=minF+100&&f<=G;f++){const n=G-f;if(n%50)continue;const k=n/50;
  const dp=new Array(k+1).fill(Infinity),ch=new Array(k+1).fill(0);dp[0]=0;
  for(let i=1;i<=k;i++)for(const[s,c]of sz){const q=s/50;if(q<=i&&dp[i-q]+c<dp[i]){dp[i]=dp[i-q]+c;ch[i]=s;}}
  if(!isFinite(dp[k]))continue;if(k===0&&f>100)continue;
  const cost=dp[k]+(f?0.4+f/100:0);
  if(!best||cost<best.cost){const u=[];let i=k;while(i>0){u.push(ch[i]);i-=ch[i]/50;}best={cost,u:u.sort((a,b)=>b-a),f};}}
 if(!best)return G>=200&&layer==='w'?{u:[],f:0,open:G}:{u:[],f:G};
 return best;}



function resolve(list,a,b,layer,warns,R){
 const acc=[];
 for(const it of list){if(it.x1<=it.x0)continue;
  if(it.x0<-1||it.x1>R.len+1){warns.push(`دیوار ${LET(R.wall)}: «${TL[it.type]}» از طول دیوار بیرون می‌زند.`);continue;}
  const hit=acc.find(o=>it.x0<o.x1-1&&it.x1>o.x0+1);
  if(hit){if(!(hit.type==='void'&&it.type==='void'))warns.push(`دیوار ${LET(R.wall)}: «${TL[it.type]}» با «${TL[hit.type]}» تداخل دارد — جابه‌جا کنید.`);continue;}
  acc.push(it);}
 acc.sort((p,q)=>p.x0-q.x0);
 const out=[];let cur=a;
 const gap=(g0,g1)=>{const G=Math.round(g1-g0);if(G<=0)return;
  const atS=g0<=0.5&&R.ws,atE=g1>=R.len-0.5&&R.we;const minF=(atS||atE)?30:0;
  const r=fill(G,layer,minF);
  if(r.open){out.push({x0:g0,x1:g1,type:'open',L:layer});return;}
  const fAtStart=atS&&!atE;let x=g0;
  if(r.f&&fAtStart){out.push({x0:x,x1:x+r.f,type:'filler',L:layer});x+=r.f;}
  for(const w of r.u){out.push({x0:x,x1:x+w,type:'gen',L:layer});x+=w;}
  if(r.f&&!fAtStart)out.push({x0:x,x1:x+r.f,type:'filler',L:layer});};
 for(const it of acc){if(it.x1<=a||it.x0>=b){out.push(it);continue;}if(it.x0>cur)gap(cur,it.x0);cur=Math.max(cur,it.x1);out.push(it);}
 if(b>cur)gap(cur,b);
 out.sort((p,q)=>p.x0-q.x0);const m=[];for(const u of out){const l=m[m.length-1];if(l&&l.type==='filler'&&u.type==='filler'&&Math.abs(l.x1-u.x0)<1){l.x1=u.x1;continue;}m.push(u);}return m;}

const STDR={counterH:[850,920,'ارتفاع صفحه'],plinth:[100,150,'قرنیز پایین'],topT:[20,40,'ضخامت صفحه'],baseD:[560,620,'عمق کابینت زمینی'],wallD:[300,370,'عمق کابینت هوایی'],splash:[450,700,'فاصله صفحه تا کابینت هوایی'],sinkW:[600,900,'عرض کابینت سینک'],frW:[700,950,'عرض جای یخچال'],waterH:[450,600,'ارتفاع شیر آب'],drainH:[350,500,'ارتفاع فاضلاب'],sockH:[1050,1200,'ارتفاع پریز روی صفحه']};
function stdMsg(u){const w=Math.round(u.x1-u.x0),nm=TL[u.type],cm=a=>a.map(x=>x/10).join('، ');
 if(['filler','endp','void','corner','open'].includes(u.type))return null;
 const rule={sink:[[600,800,900],'۶۰ تا ۹۰'],hob:[[600,900],'۶۰ یا ۹۰'],ovenb:[[600],'۶۰'],oven:[[600],'۶۰'],dw:[[450,600],'۶۰ (یا ۴۵ باریک)'],hood:[[600,900],'۶۰ یا ۹۰ (هم‌عرض گاز)']}[u.type];
 if(rule)return rule[0].includes(w)?null:`«${nm}» ${w/10} سانت شد؛ استاندارد ${rule[1]} سانت است. تغییر اعمال شد.`;
 if(u.type==='fridge')return w>=700&&w<=950?null:`جای یخچال ${w/10} سانت شد؛ استاندارد ۷۰ تا ۹۵ سانت است. تغییر اعمال شد.`;
 const std=u.L==='w'?[300,350,400,450,500,600,800,900]:[150,200,250,300,350,400,450,500,600,800,900];
 return std.includes(w)?null:`«${nm}» ${w/10} سانت شد؛ عرض‌های استاندارد: ${cm(std)} سانت. تغییر اعمال شد (سفارشی‌سازی).`;}
function manChk(R,warns){for(const u of R.base.concat(R.wu)){const m=stdMsg(u);if(m)warns.push(m.replace(' تغییر اعمال شد (سفارشی‌سازی).','').replace(' تغییر اعمال شد.',''));}const nm=R.isl?'جزیره':'دیوار '+LET(R.wall);
 for(const[lst,a,b]of[[R.base,R.u0,R.u1],[R.wu,R.w0,R.w1]]){lst.sort((p,q)=>p.x0-q.x0);let cur=a;
  for(let k=0;k<lst.length;k++){const u=lst[k];if(u.x0<cur-1&&k>0)warns.push(`${nm}: «${TL[u.type]}» با یونیت کناری روی هم افتاده است.`);
   if(u.x0>cur+1&&u.x0>a&&lst===R.base)warns.push(`${nm}: ${Math.round(u.x0-cur)} میلی‌متر فضای خالی بین کابینت‌ها (دکمه «پر کردن فاصله‌ها»).`);cur=Math.max(cur,u.x1);}
  if(lst===R.base&&lst.length&&b-cur>1)warns.push(`${nm}: ${Math.round(b-cur)} میلی‌متر فضای خالی در انتهای ردیف.`);}
 for(const t of R.base.filter(u=>u.L==='t'))if(R.wu.some(w=>w.type!=='void'&&w.x0<t.x1-1&&w.x1>t.x0+1))warns.push(`${nm}: کابینت بالا با ستون/یخچال تداخل دارد.`);}
function joints(S){const n=S.poly.length,sel=i=>S.edges[i].w&&S.edges[i].cab,J={};
 for(let i=0;i<n;i++)J[i]={};
 const idx=[...Array(n).keys()].filter(sel);if(!idx.length)return J;
 let starts=idx.filter(i=>!sel((i-1+n)%n));const loop=!starts.length;if(loop)starts=[0];
 for(const s of starts){const c=[s];let k=(s+1)%n;while(sel(k)&&k!==s){c.push(k);k=(k+1)%n;}
  const m=loop?c.length:c.length-1;
  for(let k=0;k<m;k++){const a=c[k],b=c[(k+1)%c.length],da=eg(S,a).d,db=eg(S,b).d;if(crs(da,db)>-1e-3)continue;
   const th=Math.acos(Math.max(-1,Math.min(1,dot(mul(da,-1),db)))),right=Math.abs(th-Math.PI/2)<0.035;
   const own=(c.length===2&&!loop)?(eg(S,a).len>=eg(S,b).len?a:b):(k%2===0?b:a);
   J[a].e={own:own===a,right,th,other:b};J[b].s={own:own===b,right,th,other:a};}}
 return J;}
const p0=(d,th)=>th<Math.PI/2-0.035?Math.ceil(d/Math.tan(th)/5)*5:0;
function resv(S,i,side,j,d){const o=j.other,go=eg(S,o),gi=eg(S,i),q=p0(d,j.th),L=Math.min(go.len,q+3000);
 const strip=side==='e'?quad(S,o,q,L,0,d):quad(S,o,go.len-L,go.len-q,0,d);
 for(let r=0;r<gi.len/2;r+=5){const sl=side==='e'?quad(S,i,gi.len-r-5,gi.len-r,0,d):quad(S,i,r,r+5,0,d);const fc=side==='e'?P(S,i,gi.len-r,d):P(S,i,r,d);
  if(!overlap(sl,strip)&&dot(sub(fc,go.o),go.n)>=-1)return r;}
 return Math.round(gi.len/2);}

function design(S){
 const warns=[],J=joints(S),n=S.poly.length,bd=S.baseD,wd=S.wallD;
 const hc=S.counterH-S.plinth-S.topT,wb=S.counterH+S.splash,cor={modern:0,neoclassic:60,classic:100}[S.style]||0;
 const wt=S.wallMode==='ceil'?S.H-cor:Math.min(wb+S.wallH,S.H-cor),hoodZ=S.counterH+(S.hobType==='gas'?750:650);
 const G={hc,wb,wt,cor,hoodZ};
 if(wt-wb<300)warns.push('ارتفاع کابینت بالا کمتر از ۳۰ سانت می‌شود؛ ارتفاع سقف را چک کنید.');
 const runs=[];
